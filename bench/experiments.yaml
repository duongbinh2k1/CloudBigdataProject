# Design of the experiments (read by run_all.sh and run_experiments.py)
sizes: [1, 5, 10, 20]                 # scale factor: SF 1 = about 1 GB of text
apps: [io_bound, cpu_bound, balanced]
repetitions: 3                        # each configuration is run 3 times: mean and standard deviation
seed: 20261111                        # random order of the runs, the same every time

# Two of the four codecs of the assignment, both available for files and for the shuffle:
# LZ4 = fast, compresses little (~2x); Zstd = compresses much more (~3x) for more CPU.
storage_codecs: [none, lz4, zstd]     # E1: files on HDFS compressed, shuffle not compressed
shuffle_codecs: ["off", lz4, zstd]    # E2: shuffle compressed, files not compressed
combined: {storage: zstd, shuffle: lz4}   # E3: C0 none/off, C1 zstd/off, C2 none/lz4, C3 zstd/lz4
