spark.master                      spark://master:7077
# event logs: read by the History Server (metrics of each run)
spark.eventLog.enabled            true
spark.eventLog.dir                hdfs://master:9000/spark-logs
spark.history.fs.logDirectory     hdfs://master:9000/spark-logs
# Hadoop's native library (libhadoop.so), needed by the zstd storage codec
spark.driver.extraLibraryPath     /opt/hadoop/lib/native
spark.executor.extraLibraryPath   /opt/hadoop/lib/native
