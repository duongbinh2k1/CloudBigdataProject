---
# install and start hdfs + spark
- name: Wait until the new machines accept SSH
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

- name: Every machine
  hosts: all
  become: true
  tasks:
    - name: Hostname = name in the inventory (master, worker1...)
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: /etc/hosts with the private IP of every machine, so that they call each other by name
      ansible.builtin.copy:
        dest: /etc/hosts
        content: |
          127.0.0.1 localhost
          {% for host in groups['all'] %}
          {{ hostvars[host].private_ip }} {{ host }}
          {% endfor %}

    - name: No automatic Ubuntu updates during the measurements
      ansible.builtin.command: systemctl disable --now unattended-upgrades apt-daily.timer apt-daily-upgrade.timer
      failed_when: false

    - name: Copy cluster/ (installation script and configuration files)
      ansible.builtin.copy:
        src: ../../cluster/
        dest: /opt/cluster/

    - name: Install Java, Hadoop and Spark
      ansible.builtin.command: bash /opt/cluster/install.sh

    - name: List of the workers for Hadoop (start-dfs.sh)
      ansible.builtin.copy:
        src: workers
        dest: /opt/hadoop/etc/hadoop/workers

    - name: List of the workers for Spark (start-workers.sh) and run_experiments.py
      ansible.builtin.copy:
        src: workers
        dest: /opt/spark/conf/workers

- name: The master
  hosts: master
  become: true
  become_user: ubuntu
  tasks:
    # the public key is already on every machine, so the master can ssh to all of them
    - name: SSH key of the laptop, copied to the master
      ansible.builtin.copy:
        src: ~/.ssh/cloud-bigdata-project
        dest: /home/ubuntu/.ssh/id_ed25519
        mode: "0600"

    - name: Accept the host key of a machine the first time
      ansible.builtin.copy:
        dest: /home/ubuntu/.ssh/config
        content: "Host *\n  StrictHostKeyChecking accept-new\n"
        mode: "0600"

    - name: Start HDFS and Spark
      ansible.builtin.command: bash -l /opt/cluster/start-cluster.sh

    - name: Copy the Java code
      ansible.builtin.copy:
        src: ../../java/src
        dest: /opt/work/java/

    - name: Copy the build script
      ansible.builtin.copy:
        src: ../../java/build.sh
        dest: /opt/work/java/

    - name: Copy the experiment scripts
      ansible.builtin.copy:
        src: "../../bench/{{ item }}"
        dest: /opt/work/bench/
      loop: [run_all.sh, run_experiments.py, CodecBench.java]
