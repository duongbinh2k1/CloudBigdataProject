---
# Installs and starts HDFS + Spark on the machines created by Terraform (list in inventory.ini)
- name: Wait until the new machines accept SSH
  hosts: all
  gather_facts: false
  tasks:
    - ansible.builtin.wait_for_connection: {timeout: 300}

- name: Every machine
  hosts: all
  become: true
  tasks:
    - name: Hostname = name in the inventory (master, worker1...)
      ansible.builtin.hostname: {name: "{{ inventory_hostname }}"}

    - name: /etc/hosts with the private IP of every machine, so that they call each other by name
      ansible.builtin.copy:
        dest: /etc/hosts
        content: |
          127.0.0.1 localhost
          {% for host in groups['all'] %}
          {{ hostvars[host].private_ip }} {{ host }}
          {% endfor %}

    - name: No automatic Ubuntu updates during the measurements
      ansible.builtin.systemd: {name: "{{ item }}", state: stopped, enabled: false}
      loop: [unattended-upgrades.service, apt-daily.timer, apt-daily-upgrade.timer]
      failed_when: false

    - name: Copy cluster/ (installation script and configuration files)
      ansible.builtin.copy: {src: "{{ playbook_dir }}/../../cluster/", dest: /opt/cluster/}

    - name: Install Java, Hadoop and Spark
      ansible.builtin.command: bash /opt/cluster/install.sh

    - name: List of the workers, read by start-dfs.sh, start-workers.sh and run_experiments.py
      ansible.builtin.copy:
        dest: "{{ item }}"
        content: "{{ groups['workers'] | join('\n') }}\n"
      loop: [/opt/hadoop/etc/hadoop/workers, /opt/spark/conf/workers]

- name: SSH without password from the master to every machine
  hosts: all
  become: true
  become_user: ubuntu
  tasks:
    - name: Key pair of the master
      ansible.builtin.command: ssh-keygen -t ed25519 -N "" -f /home/ubuntu/.ssh/id_ed25519
      args: {creates: /home/ubuntu/.ssh/id_ed25519}
      when: inventory_hostname == 'master'

    - name: Read the public key of the master
      ansible.builtin.slurp: {src: /home/ubuntu/.ssh/id_ed25519.pub}
      register: master_key
      when: inventory_hostname == 'master'

    - name: Add it to authorized_keys on every machine
      ansible.builtin.lineinfile:
        path: /home/ubuntu/.ssh/authorized_keys
        line: "{{ hostvars['master'].master_key.content | b64decode | trim }}"

    - name: The master accepts the host key of a machine the first time it sees it
      ansible.builtin.copy:
        dest: /home/ubuntu/.ssh/config
        mode: "0600"
        content: "Host *\n  StrictHostKeyChecking accept-new\n"
      when: inventory_hostname == 'master'

- name: Start the cluster and copy the project code
  hosts: master
  become: true
  become_user: ubuntu
  tasks:
    - name: Start HDFS and Spark
      ansible.builtin.command: bash -l /opt/cluster/start-cluster.sh

    - name: Copy the code to /opt/work (only the files of the project)
      ansible.builtin.copy: {src: "{{ playbook_dir }}/../../{{ item }}", dest: "/opt/work/{{ item | dirname }}/"}
      loop: [java/src, java/build.sh, bench/experiments.yaml, bench/run_all.sh, bench/run_experiments.py,
             bench/CodecBench.java]
