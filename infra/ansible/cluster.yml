---
# install and start hdfs + spark
- name: Wait for the machines
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for ssh
      ansible.builtin.wait_for_connection:
        timeout: 300

- name: All machines
  hosts: all
  become: true
  tasks:
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Write /etc/hosts
      ansible.builtin.copy:
        dest: /etc/hosts
        content: |
          127.0.0.1 localhost
          {% for host in groups['all'] %}
          {{ hostvars[host].private_ip }} {{ host }}
          {% endfor %}

    - name: Disable automatic updates
      ansible.builtin.command: systemctl disable --now unattended-upgrades apt-daily.timer apt-daily-upgrade.timer
      failed_when: false

    - name: Copy cluster folder
      ansible.builtin.copy:
        src: ../../cluster/
        dest: /opt/cluster/

    - name: Install java, hadoop and spark
      ansible.builtin.command: bash /opt/cluster/install.sh

    - name: Workers file for hadoop
      ansible.builtin.copy:
        src: workers
        dest: /opt/hadoop/etc/hadoop/workers

    - name: Workers file for spark
      ansible.builtin.copy:
        src: workers
        dest: /opt/spark/conf/workers

- name: Master
  hosts: master
  become: true
  become_user: ubuntu
  tasks:
    # so that the master can ssh to the other machines
    - name: Copy ssh key
      ansible.builtin.copy:
        src: ~/.ssh/cloud-bigdata-project
        dest: /home/ubuntu/.ssh/id_ed25519
        mode: "0600"

    - name: Ssh config
      ansible.builtin.copy:
        dest: /home/ubuntu/.ssh/config
        content: "Host *\n  StrictHostKeyChecking accept-new\n"
        mode: "0600"

    - name: Start hdfs and spark
      ansible.builtin.command: bash -l /opt/cluster/start-cluster.sh

    - name: Copy java code
      ansible.builtin.copy:
        src: ../../java/src
        dest: /opt/work/java/

    - name: Copy build script
      ansible.builtin.copy:
        src: ../../java/build.sh
        dest: /opt/work/java/

    - name: Copy experiment scripts
      ansible.builtin.copy:
        src: "../../bench/{{ item }}"
        dest: /opt/work/bench/
      loop: [run_all.sh, run_experiments.py, CodecBench.java]
