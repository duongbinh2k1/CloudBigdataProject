---
# Install and start HDFS + Spark on the EC2 nodes: ansible-playbook cluster.yml
# master: NameNode, Spark Master, History Server / workers: DataNode, Spark Worker
- name: Every node
  hosts: all
  become: true
  vars_files: [vars.yml]
  tasks:
    - name: Hostname = name in the inventory
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: /etc/hosts with the private IP of every node
      ansible.builtin.copy:
        dest: /etc/hosts
        content: |
          127.0.0.1 localhost
          {% for host in groups['all'] %}
          {{ hostvars[host].private_ip }} {{ host }}
          {% endfor %}

    - name: No automatic updates during the measurements
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop: [unattended-upgrades.service, apt-daily.timer, apt-daily-upgrade.timer]
      failed_when: false

    - name: Packages
      ansible.builtin.apt:
        name:
          - openjdk-11-jdk-headless
          - python3-yaml        # bench/run_experiments.py reads YAML
          - sysstat             # sar / sadf
          - libzstd1            # Hadoop's native zstd codec
          - tmux
        update_cache: true

    - name: Download and unpack Hadoop and Spark
      ansible.builtin.unarchive:
        src: "{{ item.url }}"
        dest: /opt
        remote_src: true
        owner: ubuntu
        creates: "{{ item.dir }}"
      loop:
        - {url: "{{ hadoop_url }}", dir: "/opt/hadoop-{{ hadoop_version }}"}
        - {url: "{{ spark_url }}", dir: "/opt/spark-{{ spark_version }}-bin-hadoop3"}

    - name: /opt/hadoop and /opt/spark
      ansible.builtin.file:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        state: link
      loop:
        - {src: "/opt/hadoop-{{ hadoop_version }}", dest: /opt/hadoop}
        - {src: "/opt/spark-{{ spark_version }}-bin-hadoop3", dest: /opt/spark}

    - name: Environment variables for every shell
      ansible.builtin.copy:
        dest: /etc/profile.d/bigdata.sh
        content: |
          export JAVA_HOME={{ java_home }}
          export HADOOP_HOME=/opt/hadoop
          export HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
          export SPARK_HOME=/opt/spark
          export PATH=/opt/spark/bin:/opt/spark/sbin:/opt/hadoop/bin:/opt/hadoop/sbin:$PATH

    - name: Hadoop configuration
      ansible.builtin.template:
        src: "templates/{{ item }}"
        dest: "/opt/hadoop/etc/hadoop/{{ item }}"
        owner: ubuntu
      loop: [core-site.xml, hdfs-site.xml, hadoop-env.sh]

    - name: Spark configuration
      ansible.builtin.template:
        src: "templates/{{ item }}"
        dest: "/opt/spark/conf/{{ item }}"
        owner: ubuntu
      loop: [spark-env.sh, spark-defaults.conf]

    - name: List of workers for start-dfs.sh and start-workers.sh
      ansible.builtin.copy:
        dest: "{{ item }}"
        owner: ubuntu
        content: "{{ groups['workers'] | join('\n') }}\n"
      loop: [/opt/hadoop/etc/hadoop/workers, /opt/spark/conf/workers]

    - name: Directories (HDFS blocks, shuffle files, project code)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
      loop: [/data/hdfs, /data/spark-local, /opt/work]

    - name: No periodic sysstat collection (sar is started by the experiment script)
      ansible.builtin.systemd:
        name: sysstat
        state: stopped
        enabled: false

    # zstd needs Hadoop's native library
    - name: hadoop checknative must report zstd = true
      ansible.builtin.command: /opt/hadoop/bin/hadoop checknative
      environment: {JAVA_HOME: "{{ java_home }}"}
      register: checknative
      changed_when: false
      failed_when: checknative.stdout is not search('zstd\s*:\s*true')

- name: Passwordless SSH from the master to every node (start-*.sh scripts, run_experiments.py)
  hosts: all
  become: true
  become_user: ubuntu
  tasks:
    - name: SSH key of the master
      ansible.builtin.command: ssh-keygen -t ed25519 -N "" -f /home/ubuntu/.ssh/id_ed25519
      args: {creates: /home/ubuntu/.ssh/id_ed25519}
      when: inventory_hostname == 'master'

    - name: Read the master's public key
      ansible.builtin.slurp: {src: /home/ubuntu/.ssh/id_ed25519.pub}
      register: master_key
      when: inventory_hostname == 'master'

    - name: Authorize it on every node
      ansible.posix.authorized_key:
        user: ubuntu
        key: "{{ hostvars['master'].master_key.content | b64decode }}"

    - name: Accept the host keys of new nodes
      ansible.builtin.copy:
        dest: /home/ubuntu/.ssh/config
        mode: "0600"
        content: |
          Host *
            StrictHostKeyChecking accept-new
      when: inventory_hostname == 'master'

- name: Start HDFS and Spark from the master
  hosts: master
  become: true
  become_user: ubuntu
  vars_files: [vars.yml]
  environment:
    JAVA_HOME: "{{ java_home }}"
  tasks:
    - name: Format the NameNode (first time only)
      ansible.builtin.command: /opt/hadoop/bin/hdfs namenode -format -nonInteractive
      args: {creates: /data/hdfs/namenode/current/VERSION}

    - name: (Re)start HDFS
      ansible.builtin.shell: /opt/hadoop/sbin/stop-dfs.sh; /opt/hadoop/sbin/start-dfs.sh

    - name: Wait until HDFS leaves safe mode
      ansible.builtin.command: /opt/hadoop/bin/hdfs dfsadmin -safemode wait

    - name: HDFS directories
      ansible.builtin.command: /opt/hadoop/bin/hdfs dfs -mkdir -p /spark-logs /data /results

    - name: (Re)start Spark master, workers and History Server
      ansible.builtin.shell: |
        /opt/spark/sbin/stop-all.sh; /opt/spark/sbin/stop-history-server.sh
        /opt/spark/sbin/start-master.sh && /opt/spark/sbin/start-workers.sh && /opt/spark/sbin/start-history-server.sh

    - name: Copy the project code (java/, bench/)
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../../{{ item }}"
        dest: /opt/work/
      loop: [java, bench]
      become: false

    - name: Build the jar
      ansible.builtin.command: bash java/build.sh
      args: {chdir: /opt/work}
      environment: {SPARK_HOME: /opt/spark}
