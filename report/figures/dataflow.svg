<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- where compression acts -->
  <rect x="10" y="12" width="145" height="24" rx="4" fill="#fbeee0" stroke="#d9772b"/>
  <text x="82" y="29" text-anchor="middle" font-size="11.5" fill="#a5501a">① storage compression</text>
  <rect x="805" y="12" width="145" height="24" rx="4" fill="#fbeee0" stroke="#d9772b"/>
  <text x="877" y="29" text-anchor="middle" font-size="11.5" fill="#a5501a">① storage compression</text>
  <rect x="395" y="12" width="370" height="24" rx="4" fill="#e6effc" stroke="#2a6fd6"/>
  <text x="580" y="29" text-anchor="middle" font-size="11.5" fill="#1d4f9c">② communication (shuffle) compression</text>

  <!-- boxes -->
  <rect x="10" y="50" width="145" height="100" rx="8" fill="#fbeee0" stroke="#d9772b"/>
  <text x="82" y="72" text-anchor="middle" font-weight="bold">HDFS input</text>
  <text x="20" y="94">lineitem (+ orders)</text>
  <text x="20" y="114">none / LZ4 / Zstd files</text>
  <text x="20" y="134">3 replicas</text>

  <rect x="195" y="50" width="160" height="100" rx="8" fill="#f4f4f2" stroke="#666"/>
  <text x="275" y="72" text-anchor="middle" font-weight="bold">Stage 1: map tasks</text>
  <text x="205" y="94">read + decompress</text>
  <text x="205" y="114">parse, (SHA-256 ×64:</text>
  <text x="205" y="134">CPU-bound app)</text>

  <rect x="395" y="50" width="150" height="100" rx="8" fill="#e6effc" stroke="#2a6fd6"/>
  <text x="470" y="72" text-anchor="middle" font-weight="bold">Shuffle files</text>
  <text x="405" y="94">serialize + compress</text>
  <text x="405" y="114">on the local disk</text>
  <text x="405" y="134">(page cache)</text>

  <rect x="615" y="50" width="150" height="100" rx="8" fill="#f4f4f2" stroke="#666"/>
  <text x="690" y="72" text-anchor="middle" font-weight="bold">Stage 2: reduce</text>
  <text x="625" y="94">fetch + decompress</text>
  <text x="625" y="114">sort / join / aggregate</text>
  <text x="625" y="134">(SHA-256 ×8: Balanced)</text>

  <rect x="805" y="50" width="145" height="100" rx="8" fill="#fbeee0" stroke="#d9772b"/>
  <text x="877" y="72" text-anchor="middle" font-weight="bold">HDFS output</text>
  <text x="815" y="94">compress (storage</text>
  <text x="815" y="114">codec), written</text>
  <text x="815" y="134">3 times (replicas)</text>

  <line x1="155" y1="100" x2="193" y2="100" stroke="#444" marker-end="url(#a)"/>
  <line x1="355" y1="100" x2="393" y2="100" stroke="#444" marker-end="url(#a)"/>
  <line x1="545" y1="100" x2="613" y2="100" stroke="#2a6fd6" stroke-width="2" marker-end="url(#a)"/>
  <text x="580" y="92" text-anchor="middle" font-size="11" fill="#1d4f9c">network</text>
  <line x1="765" y1="100" x2="803" y2="100" stroke="#444" marker-end="url(#a)"/>

  <!-- volumes per app -->
  <text x="10" y="190" font-weight="bold">Volumes at SF 20 without compression</text>
  <g font-size="11.5">
    <rect x="10" y="200" width="940" height="1" fill="#ccc"/>
    <text x="10" y="222" font-weight="bold">I/O-bound</text>
    <text x="150" y="222">input 15.5 GB, read twice</text>
    <text x="395" y="222">shuffle 17.3 GB (14.8 GB over the network)</text>
    <text x="805" y="222">output 15.5 GB × 3</text>
    <text x="10" y="252" font-weight="bold">Balanced</text>
    <text x="150" y="252">input 19.1 GB (both tables)</text>
    <text x="395" y="252">shuffle 10.9 GB (9.3 GB over the network)</text>
    <text x="805" y="252">output 0.01 GB</text>
    <text x="10" y="282" font-weight="bold">CPU-bound</text>
    <text x="150" y="282">input 15.5 GB</text>
    <text x="395" y="282">shuffle 0.1 MB (combined on the map side)</text>
    <text x="805" y="282">output ≈ 0</text>
    <rect x="10" y="295" width="940" height="1" fill="#ccc"/>
  </g>
  <text x="10" y="318" font-size="11" fill="#555">Storage codec: Hadoop codec of the files (Zstd level 3). Shuffle codec: spark.io.compression.codec (Zstd level 1); Spark cannot use Gzip for the shuffle.</text>
</svg>
