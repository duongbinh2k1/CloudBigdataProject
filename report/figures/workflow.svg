<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- row 1: commands on the laptop -->
  <text x="10" y="18" font-weight="bold" fill="#555">On the laptop</text>
  <g>
    <rect x="10" y="28" width="165" height="56" rx="8" fill="#f4f4f2" stroke="#666"/>
    <text x="92" y="50" text-anchor="middle" font-weight="bold">make up</text>
    <text x="92" y="70" text-anchor="middle" font-size="11">Terraform + Ansible (~15 min)</text>
    <rect x="205" y="28" width="165" height="56" rx="8" fill="#eef3fb" stroke="#2a6fd6" stroke-width="2"/>
    <text x="287" y="50" text-anchor="middle" font-weight="bold">make run</text>
    <text x="287" y="70" text-anchor="middle" font-size="11">run_all.sh on the master</text>
    <rect x="400" y="28" width="165" height="56" rx="8" fill="#f4f4f2" stroke="#666"/>
    <text x="482" y="50" text-anchor="middle" font-weight="bold">make fetch</text>
    <text x="482" y="70" text-anchor="middle" font-size="11">rsync results/</text>
    <rect x="595" y="28" width="165" height="56" rx="8" fill="#f4f4f2" stroke="#666"/>
    <text x="677" y="50" text-anchor="middle" font-weight="bold">make analysis</text>
    <text x="677" y="70" text-anchor="middle" font-size="11">figures + tables</text>
    <rect x="790" y="28" width="160" height="56" rx="8" fill="#f4f4f2" stroke="#666"/>
    <text x="870" y="50" text-anchor="middle" font-weight="bold">make down</text>
    <text x="870" y="70" text-anchor="middle" font-size="11">delete AWS resources</text>
    <line x1="175" y1="56" x2="203" y2="56" stroke="#444" marker-end="url(#a)"/>
    <line x1="370" y1="56" x2="398" y2="56" stroke="#444" marker-end="url(#a)"/>
    <line x1="565" y1="56" x2="593" y2="56" stroke="#444" marker-end="url(#a)"/>
    <line x1="760" y1="56" x2="788" y2="56" stroke="#444" marker-end="url(#a)"/>
  </g>

  <!-- row 2: run_all.sh -->
  <line x1="287" y1="84" x2="287" y2="112" stroke="#2a6fd6" stroke-width="2" marker-end="url(#a)"/>
  <rect x="10" y="114" width="940" height="88" rx="10" fill="none" stroke="#2a6fd6" stroke-dasharray="5 4"/>
  <text x="22" y="132" font-weight="bold" fill="#1d4f9c">bench/run_all.sh on the master, in tmux (~8.5 h; steps already done are skipped)</text>
  <g font-size="11.5">
    <rect x="22" y="142" width="190" height="48" rx="6" fill="#eef3fb" stroke="#2a6fd6"/>
    <text x="117" y="162" text-anchor="middle" font-weight="bold">1. build</text>
    <text x="117" y="180" text-anchor="middle">javac → app.jar</text>
    <rect x="252" y="142" width="215" height="48" rx="6" fill="#eef3fb" stroke="#2a6fd6"/>
    <text x="360" y="162" text-anchor="middle" font-weight="bold">2. DataGen</text>
    <text x="360" y="180" text-anchor="middle">4 sizes × 3 codecs → HDFS</text>
    <rect x="507" y="142" width="200" height="48" rx="6" fill="#eef3fb" stroke="#2a6fd6"/>
    <text x="607" y="162" text-anchor="middle" font-weight="bold">3. CodecBench</text>
    <text x="607" y="180" text-anchor="middle">4 codecs, 1 thread, in memory</text>
    <rect x="747" y="142" width="190" height="48" rx="6" fill="#dbe7fb" stroke="#2a6fd6" stroke-width="2"/>
    <text x="842" y="162" text-anchor="middle" font-weight="bold">4. run_experiments.py</text>
    <text x="842" y="180" text-anchor="middle">216 runs</text>
    <line x1="212" y1="166" x2="250" y2="166" stroke="#444" marker-end="url(#a)"/>
    <line x1="467" y1="166" x2="505" y2="166" stroke="#444" marker-end="url(#a)"/>
    <line x1="707" y1="166" x2="745" y2="166" stroke="#444" marker-end="url(#a)"/>
  </g>

  <!-- row 3: one run -->
  <line x1="842" y1="190" x2="842" y2="232" stroke="#2a6fd6" stroke-width="2" marker-end="url(#a)"/>
  <text x="10" y="226" font-weight="bold" fill="#555">One run (× 216, random order with a fixed seed, + 1 warm-up per application)</text>
  <g font-size="11.5">
    <rect x="10" y="236" width="170" height="72" rx="6" fill="#f1f8ee" stroke="#3c8d2f"/>
    <text x="95" y="256" text-anchor="middle" font-weight="bold">on the 8 machines (SSH)</text>
    <text x="95" y="275" text-anchor="middle">drop the page cache</text>
    <text x="95" y="293" text-anchor="middle">start sar (1 / s)</text>
    <rect x="200" y="236" width="170" height="72" rx="6" fill="#f1f8ee" stroke="#3c8d2f"/>
    <text x="285" y="254" text-anchor="middle" font-weight="bold">spark-submit</text>
    <text x="285" y="271" text-anchor="middle">app on the input files</text>
    <text x="285" y="286" text-anchor="middle">of the storage codec,</text>
    <text x="285" y="301" text-anchor="middle">--conf shuffle codec</text>
    <rect x="390" y="236" width="170" height="72" rx="6" fill="#f1f8ee" stroke="#3c8d2f"/>
    <text x="475" y="256" text-anchor="middle" font-weight="bold">stop sar</text>
    <text x="475" y="275" text-anchor="middle">raw data →</text>
    <text x="475" y="293" text-anchor="middle">results/sar/run/node.csv</text>
    <rect x="580" y="236" width="170" height="72" rx="6" fill="#f1f8ee" stroke="#3c8d2f"/>
    <text x="665" y="256" text-anchor="middle" font-weight="bold">History Server API</text>
    <text x="665" y="275" text-anchor="middle">time, CPU, shuffle bytes,</text>
    <text x="665" y="293" text-anchor="middle">shuffle time, spills</text>
    <rect x="770" y="236" width="180" height="72" rx="6" fill="#f1f8ee" stroke="#3c8d2f"/>
    <text x="860" y="256" text-anchor="middle" font-weight="bold">results/runs.csv</text>
    <text x="860" y="275" text-anchor="middle">+1 line (26 columns);</text>
    <text x="860" y="293" text-anchor="middle">delete the output</text>
    <line x1="180" y1="272" x2="198" y2="272" stroke="#444" marker-end="url(#a)"/>
    <line x1="370" y1="272" x2="388" y2="272" stroke="#444" marker-end="url(#a)"/>
    <line x1="560" y1="272" x2="578" y2="272" stroke="#444" marker-end="url(#a)"/>
    <line x1="750" y1="272" x2="768" y2="272" stroke="#444" marker-end="url(#a)"/>
    <path d="M860,308 L860,335 L95,335 L95,310" fill="none" stroke="#3c8d2f" stroke-dasharray="4 3" marker-end="url(#a)"/>
    <text x="478" y="352" text-anchor="middle" font-size="11" fill="#3c8d2f">next run</text>
  </g>
</svg>
