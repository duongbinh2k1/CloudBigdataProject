spark.master                      spark://master:7077
# 3 of the 8 GB of a worker, the rest for the DataNode, the OS and the page cache
# (the default, 1 GB, would make the large sizes spill to disk all the time)
spark.executor.memory             3g
# event logs on HDFS: the History Server reads them and gives the metrics of each run
spark.eventLog.enabled            true
spark.eventLog.dir                hdfs://master:9000/spark-logs
spark.history.fs.logDirectory     hdfs://master:9000/spark-logs
# Hadoop's native library (libhadoop.so): needed by the zstd codec for files
spark.driver.extraLibraryPath     /opt/hadoop/lib/native
spark.executor.extraLibraryPath   /opt/hadoop/lib/native
